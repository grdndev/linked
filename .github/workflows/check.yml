name: Verify mobile and API
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm --prefix server ci
      - run: npm run typecheck
      - run: npm --prefix server run typecheck
      - run: npm test
      - run: npm run export
        env:
          EXPO_NO_TELEMETRY: '1'
          EXPO_PUBLIC_API_DRIVER: mock

      - run: npm run build:dashboard && npm run build:boutique
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid
